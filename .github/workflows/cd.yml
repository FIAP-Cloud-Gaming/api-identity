name: CD

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - '.gitignore'

env:
  DOTNET_VERSION: '10.0.x'
  CONFIGURATION: Release
  IMAGE_NAME: identity-api
  IMAGE_VERSION: '1.0.0'

jobs:
  build-and-test:
    uses: ./.github/workflows/ci.yml
    permissions:
      packages: read
      contents: read
      checks: write

  publish:
    name: build and push docker image
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
    - name: checkout code
      uses: actions/checkout@v6

    - name: setup docker buildx
      uses: docker/setup-buildx-action@v3

    - name: login to ghcr
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}},value=${{ env.IMAGE_VERSION }}
          type=semver,pattern={{major}}.{{minor}},value=${{ env.IMAGE_VERSION }}
          type=sha,prefix=
          type=raw,value=latest

    - name: build and push docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: src/Identity.API/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        secrets: github_token=${{ secrets.GITHUB_TOKEN }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: lowercase image name
      id: lower
      run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT

    - name: scan for vulnerabilities
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ steps.lower.outputs.image }}
        format: table
        exit-code: '0'
        ignore-unfixed: true
        severity: CRITICAL,HIGH